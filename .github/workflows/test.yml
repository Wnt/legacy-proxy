name: Test

# Typecheck and unit tests on every push and pull request (fork addition;
# upstream CI only builds images).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build inputs are pinned
        # Every Dockerfile FROM/syntax image is tag@sha256:<digest> and every
        # action is a full commit SHA (audit deploy-4); bump them together.
        run: |
          bad=$( { grep -nE '^[[:space:]]*FROM[[:space:]]|^# *syntax=' $(git ls-files '*Dockerfile*') | grep -vE '@sha256:[0-9a-f]{64}([[:space:]]|$)';
                   grep -nE '^[[:space:]]*(-[[:space:]]*)?uses:' .github/workflows/*.yml | grep -vE 'uses:[[:space:]]*(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$))'; } || true)
          if [ -n "$bad" ]; then echo "::error::Unpinned build inputs (pin images as tag@sha256:<digest>, actions to a full commit SHA):"; echo "$bad"; exit 1; fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Compile better-sqlite3 from the lockfile-verified tarball against the
        # installed Node's headers instead of downloading an unverified prebuild.
        run: |
          npm_config_build_from_source=better-sqlite3 \
          npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" \
            npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test
